<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            color: #333;
            text-align: center;
        }

        header {
            padding: 50px 20px;
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .mensaje {
            font-size: 18px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px;
        }

        .foto {
            height: 180px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 40px;
        }

        footer {
            padding: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>❤️ Nuestro Álbum ❤️</h1>
        <p class="mensaje">
            Cada fotografía guarda un momento especial.
        </p>
    </header>

    <section class="galeria">

        <div class="foto">📷</div>
        <div class="foto">📷</div>
        <div class="foto">📷</div>
        <div class="foto">📷</div>

    </section>

    <footer>
        Hecho con ❤️
    </footer>

</body>
</html>
